<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeonWrt LuCI Login Preview</title>
  <link rel="stylesheet" href="/luci-theme-neonwrt/root/www/luci-static/neonwrt/cascade.css">
</head>
<body>
  <main class="login-screen">
    <section class="login-panel">
      <header>
        <span class="eyebrow">LuCI / restricted node</span>
        <h1><span>登录</span></h1>
        <p>验证身份后进入路由器控制台。</p>
      </header>
      <form class="login-form">
        <div class="login-field">
          <label for="username">用户名</label>
          <input id="username" value="root" autocomplete="username">
        </div>
        <div class="login-field">
          <label for="password">密码</label>
          <input id="password" type="password" autocomplete="current-password">
        </div>
        <div class="login-actions">
          <button class="btn primary" type="button">登录</button>
          <span class="login-status">auth channel ready</span>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
